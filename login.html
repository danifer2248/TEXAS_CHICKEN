<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Cochabamba | Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <div class="logo-badge">TC</div>
            <div class="logo-text">Texas Cochabamba</div>
        </a>

        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="menu.html">Menú</a></li>
            <li><a href="login.html" class="active" data-auth-link="login">Iniciar Sesión</a></li>
            <li><a href="registro.html" data-auth-link="register">Registrarse</a></li>
            <li><button class="btn-logout hidden" id="logout-btn" type="button">Cerrar sesión</button></li>
            <li>
                <button class="btn-cart" id="cart-btn">
                    🛒 Carrito (<span id="cart-counter">0</span>)
                </button>
            </li>
        </ul>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-container">
        <section class="page-section">
            <div class="form-container">
                <h2>Iniciar Sesión</h2>
                <form id="form-login">
                    <div class="form-group">
                        <label for="login-email">Correo Electrónico</label>
                        <input type="email" id="login-email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-submit">Entrar</button>
                </form>

                <!-- ENLACE A REGISTRO -->
                <p class="register-redirect">
                    ¿No tienes cuenta? <a href="registro.html">Créate una</a>
                </p>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <div>
                <h3>Texas Cochabamba</h3>
                <p>El verdadero sabor del pollo frito.</p>
            </div>
            <div class="social-links">
                <a href="https://www.facebook.com/p/TEXAS-Cochabamba-61589347496199/" target="_blank" rel="noopener">Facebook</a>
                <a href="https://www.instagram.com/texascbba/" target="_blank" rel="noopener">Instagram</a>
            </div>
        </div>
        <div class="copyright">
            &copy; 2026 Texas Cochabamba. Todos los derechos reservados.
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
